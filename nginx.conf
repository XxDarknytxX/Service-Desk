# Service Desk — NGINX site config
#
# NGINX does two jobs: serves the built React app (frontend/build) as static
# files, and reverse-proxies /api to the Node API on 127.0.0.1:5000. The Node
# server does NOT serve the frontend, so this proxy is required.
#
# Installed by deploy.sh to /etc/nginx/sites-available/servicedesk.
#
# Two server blocks: a tiny one that 301s http://servicehub.vodafone.com.fj to
# HTTPS, and the main default_server that handles everything else on both 80 and
# 443 — so bare-IP HTTP keeps working for internal users.
#
# TLS uses the wildcard *.vodafone.com.fj certificate, which covers
# servicehub.vodafone.com.fj. It does NOT cover bare IP addresses — no public CA
# issues for an IP — so https://<ip> shows a name-mismatch warning by design.
# Internal access should stay on http://<ip>, or use the hostname.

# Rate limiting. Auth is deliberately much stricter than the rest of the API:
# it's the endpoint worth brute-forcing. (Note: the express-rate-limit rules in
# server.js are registered on /api/login and /api/register, which don't match
# the real /api/auth/login route — so this NGINX zone is what actually protects
# the login endpoint today.)
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

upstream backend_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Plain HTTP on the HOSTNAME redirects to HTTPS. This is a dedicated server block
# rather than an `if` inside the main one: nginx matches server_name before any
# request processing, so the redirect applies to exactly the hostname and nothing
# else — no `if` semantics to get wrong.
#
# Deliberately scoped to the hostname ONLY. A blanket http->https redirect would
# send internal users on http://172.26.70.8 to https://172.26.70.8, where this
# wildcard cert doesn't match a bare IP, turning a working page into a warning.
server {
    listen 80;
    listen [::]:80;
    server_name servicehub.vodafone.com.fj;
    return 301 https://$host$request_uri;
}

server {
    # default_server so this block also catches bare-IP requests and any other
    # Host header, on both ports.
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # fullchain = leaf + RapidSSL intermediate. The intermediate MUST be present:
    # the .crt shipped in the vendor zip contains only the leaf, and serving that
    # alone makes clients without the intermediate cached fail with
    # "unable to get local issuer certificate". deploy.sh falls back to a
    # self-signed pair at these same paths if the real cert hasn't been uploaded,
    # so nginx can always start.
    ssl_certificate     /etc/nginx/ssl/servicehub.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/servicehub.privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/servicedesk/frontend/build;
    index index.html;

    # Ticket attachments / xlsx imports go through multer — keep this above the
    # app's own upload limit so NGINX isn't what rejects a legitimate file.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS is NOT set here — it is owned by the API, in backend/src/server.js,
    # where helmet emits it on every /api response (nginx does not strip upstream
    # headers, so it reaches the browser regardless of this block). It is pinned
    # there to a deliberately short max-age=300 without includeSubDomains.
    #
    # Do not add an HSTS add_header here as well: you'd end up with two owners
    # disagreeing. Change it in server.js. Ramp (300 -> 86400 -> 31536000) only
    # once renewal of this manually-issued cert (expires 2027-03-23) is a
    # reliable, owned process — a cached year-long entry turns a missed renewal
    # into a lockout that cannot be retracted.

    # ── Auth endpoints (strict rate limit) ─────────────────────────────────
    # Must come before the general /api/ block so it wins the prefix match.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Report/export endpoints can be slow over wide date ranges.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Let the API return its own JSON errors rather than NGINX HTML pages.
        proxy_intercept_errors off;
    }

    location /health {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA routes ─────────────────────────────────────────────────────────
    # React Router owns the URL space: anything that isn't a real file falls back
    # to index.html so a deep link like /tickets/3 loads the app instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or after a deploy users keep an old copy
    # pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/servicedesk.access.log;
    error_log  /var/log/nginx/servicedesk.error.log;
}

# ── Certificate: what's installed and how to replace it ───────────────────
# Wildcard *.vodafone.com.fj from RapidSSL (DigiCert), covering
# servicehub.vodafone.com.fj. Installed as two files, NEITHER of which is in git:
#
#   /etc/nginx/ssl/servicehub.fullchain.pem   leaf + RapidSSL intermediate
#   /etc/nginx/ssl/servicehub.privkey.pem     private key, chmod 600, root-owned
#
# The vendor zip ships a .pfx (cert + key + chain, password in Pass.txt) and a
# .crt that holds ONLY the leaf — don't install that .crt on its own, clients
# that haven't cached the intermediate will reject it. Rebuild both files from
# the .pfx with:
#
#   openssl pkcs12 -in star.vodafone.com.fj.pfx -clcerts -nokeys -passin pass:PW \
#     | openssl x509 > leaf.pem
#   openssl pkcs12 -in star.vodafone.com.fj.pfx -cacerts -nokeys -passin pass:PW \
#     | sed -n '/BEGIN CERT/,/END CERT/p' > chain.pem
#   openssl pkcs12 -in star.vodafone.com.fj.pfx -nocerts -nodes  -passin pass:PW \
#     | sed -n '/BEGIN PRIVATE KEY/,/END PRIVATE KEY/p' > privkey.pem
#
# Order matters: fullchain must be leaf THEN intermediate. The PFX lists the root
# before the intermediate, so concatenating its output verbatim gives a wrong
# chain — drop the self-signed root and keep leaf + RapidSSL TLS RSA CA G1.
# Verify before reloading:  openssl verify -untrusted chain.pem leaf.pem
#
# EXPIRES 2027-03-23 — renewal is manual (this is not a certbot/ACME cert).
# Put a calendar reminder ~30 days out; an expired cert takes the site down for
# every external user.
#
# NB: nginx refuses to start if ssl_certificate points at a missing file, so the
# files must exist before a reload. deploy.sh generates a self-signed pair at
# these same paths when they're absent, which keeps a fresh server bootable.
