# Service Desk — NGINX site config
#
# NGINX does two jobs: serves the built React app (frontend/build) as static
# files, and reverse-proxies /api to the Node API on 127.0.0.1:5000. The Node
# server does NOT serve the frontend, so this proxy is required.
#
# Installed by deploy.sh to /etc/nginx/sites-available/servicedesk.
#
# Currently plain HTTP, server_name `_` — works on the bare public IP today and
# keeps working when a domain is added. See the HTTPS section at the bottom.

# Rate limiting. Auth is deliberately much stricter than the rest of the API:
# it's the endpoint worth brute-forcing. (Note: the express-rate-limit rules in
# server.js are registered on /api/login and /api/register, which don't match
# the real /api/auth/login route — so this NGINX zone is what actually protects
# the login endpoint today.)
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

upstream backend_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/servicedesk/frontend/build;
    index index.html;

    # Ticket attachments / xlsx imports go through multer — keep this above the
    # app's own upload limit so NGINX isn't what rejects a legitimate file.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers. HSTS is intentionally omitted until TLS is in place —
    # sending it over plain HTTP would pin browsers to an https:// that doesn't
    # exist yet and lock users out. Certbot adds it with the cert.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Auth endpoints (strict rate limit) ─────────────────────────────────
    # Must come before the general /api/ block so it wins the prefix match.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Report/export endpoints can be slow over wide date ranges.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Let the API return its own JSON errors rather than NGINX HTML pages.
        proxy_intercept_errors off;
    }

    location /health {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA routes ─────────────────────────────────────────────────────────
    # React Router owns the URL space: anything that isn't a real file falls back
    # to index.html so a deep link like /tickets/3 loads the app instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or after a deploy users keep an old copy
    # pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/servicedesk.access.log;
    error_log  /var/log/nginx/servicedesk.error.log;
}

# ── Adding HTTPS later ────────────────────────────────────────────────────
# Once a domain's DNS points at this server:
#   1. replace `server_name _;` above with your domain
#   2. sudo certbot --nginx -d your.domain
# Certbot adds the TLS listener, the HTTP->HTTPS redirect and HSTS in place.
# Then set CORS_ORIGIN in backend/.env to the https:// origin.
#
# Don't hand-write a `listen 443 ssl` block before the certificate exists —
# NGINX fails to start if ssl_certificate points at a missing file, which is
# what the previous version of this config did.
